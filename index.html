<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Portal - Sri Vishnu Priya</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        :root { --primary: #0f172a; --secondary: #2563eb; --bg-color: #f1f5f9; --card-bg: #ffffff; --text-dark: #1e293b; --border: #e2e8f0; --success: #16a34a; }
        body { font-family: 'Inter', sans-serif; margin: 0; background-color: var(--bg-color); color: var(--text-dark); }
        #login-screen { display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, var(--primary), var(--secondary)); }
        .login-box { background: var(--card-bg); padding: 40px; border-radius: 12px; width: 100%; max-width: 380px; text-align: center; }
        .form-group { margin-bottom: 20px; text-align: left; } .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; }
        .form-group select, .form-group input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; }
        .btn-full { width: 100%; padding: 12px; background: var(--secondary); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        #dashboard-screen { display: none; min-height: 100vh; }
        .sidebar { width: 260px; background: var(--primary); color: white; position: fixed; height: 100vh; display: flex; flex-direction: column; }
        .brand { padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .tab-btn { background: transparent; color: #cbd5e1; border: none; padding: 15px 25px; text-align: left; cursor: pointer; width: 100%; }
        .tab-btn.active { background: rgba(255,255,255,0.05); color: white; border-left: 4px solid var(--secondary); }
        .main-content { margin-left: 260px; padding: 30px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid var(--border); padding-bottom: 15px; }
        .btn-print { background: var(--text-dark); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
        .btn-submit { background: var(--success); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        .table-container { background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #f8fafc; padding: 15px; font-size: 0.85rem; border-bottom: 1px solid var(--border); }
        td { padding: 15px; border-bottom: 1px solid var(--border); }
        .input-sm { padding: 8px; border: 1px solid var(--border); border-radius: 4px; }
        .cards-wrapper { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border); flex: 1; text-align: center; }
        .stat-card h5 { margin: 0 0 10px 0; font-size: 0.8rem; } .stat-card .val { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
        .tab-content { display: none; } .tab-content.active { display: block; }
        @media print { body { background: white; } .sidebar, .no-print { display: none !important; } .main-content { margin: 0; padding: 0; } .stat-card, table, th, td { border: 1px solid #000; } }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>Employee Login</h2>
            <div class="form-group"><label>Select Name</label><select id="login-emp-name"></select></div>
            <div class="form-group"><label>Passcode</label><input type="password" id="login-passcode"></div>
            <button class="btn-full" onclick="authEmp()">LOG IN</button>
        </div>
    </div>

    <div id="dashboard-screen">
        <div class="sidebar no-print">
            <div class="brand"><h2>Employee Portal</h2><p id="display-emp-name"></p></div>
            <button class="tab-btn active" onclick="switchTab('daily-entry', this)">DAILY ENTRY</button>
            <button class="tab-btn" onclick="switchTab('performance-report', this)">PERFORMANCE REPORT</button>
            <button class="tab-btn" style="margin-top:auto; background:#991b1b;" onclick="location.reload()">LOGOUT</button>
        </div>

        <div class="main-content">
            <div id="daily-entry" class="tab-content active">
                <div class="section-header no-print">
                    <h3>DAILY PERFORMANCE ENTRY</h3><span>Date: <span id="entry-date"></span></span>
                </div>
                <div class="table-container">
                    <table>
                        <thead><tr><th>A/C No</th><th>Type</th><th>INS/Year</th><th>Status</th><th>Amount</th><th>Action</th></tr></thead>
                        <tbody id="assigned-accounts-body"></tbody>
                    </table>
                </div>
            </div>

            <div id="performance-report" class="tab-content">
                <div class="section-header no-print">
                    <h3>PERFORMANCE REPORT</h3>
                    <div style="display:flex; gap:10px;">
                        <input type="date" id="report-date-select" class="input-sm">
                        <button class="btn-submit" onclick="fetchEmployeeReport()">SEARCH</button>
                        <button class="btn-print" onclick="window.print()">🖨️ PRINT</button>
                    </div>
                </div>

                <div class="print-header" style="text-align:center; display:none;" id="print-header-div">
                    <h2>PERFORMANCE REPORT</h2><p><span id="print-emp-name"></span> | <span id="print-report-date"></span></p>
                </div>

                <h4>REGULAR SUMMARY</h4><div class="cards-wrapper" id="r-cards"></div>
                <h4>MATURED SUMMARY</h4><div class="cards-wrapper" id="m-cards"></div>
                <h4>SUBMITTED PERFORMANCE</h4>
                <div class="table-container">
                    <table>
                        <thead><tr><th>A/C No</th><th>Type</th><th>INS</th><th>Status</th><th>Amount</th></tr></thead>
                        <tbody id="submitted-performance-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, get, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyAvjFcKKiu4OMmQckYXMTejdBJh9tC6TjM", authDomain: "sri-vishnu-priya-finance-c591f.firebaseapp.com", databaseURL: "https://sri-vishnu-priya-finance-c591f-default-rtdb.firebaseio.com", projectId: "sri-vishnu-priya-finance-c591f", storageBucket: "sri-vishnu-priya-finance-c591f.firebasestorage.app", messagingSenderId: "184676228358", appId: "1:184676228358:web:c2b32b68debeeadadfd287" };
        const app = initializeApp(firebaseConfig); const db = getDatabase(app);

        const d = new Date();
        const todayStr = `${d.getDate().toString().padStart(2,'0')}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getFullYear()}`;
        document.getElementById('entry-date').innerText = todayStr;
        
        let loggedEmp = "", empMap = {}, totalRAssign=0, totalMAssign=0;

        // Login Logic
        onValue(ref(db, 'executives'), (snap) => {
            const sel = document.getElementById('login-emp-name'); sel.innerHTML = '<option value="">--Select--</option>';
            if(snap.exists()) { snap.forEach(ch => { empMap[ch.val().name] = ch.val().passcode; sel.innerHTML += `<option value="${ch.val().name}">${ch.val().name}</option>`; }); }
        });

        window.authEmp = function() {
            const n = document.getElementById('login-emp-name').value, p = document.getElementById('login-passcode').value;
            if(empMap[n] === p) {
                loggedEmp = n; document.getElementById('login-screen').style.display='none'; document.getElementById('dashboard-screen').style.display='block';
                document.getElementById('display-emp-name').innerText = n; document.getElementById('print-emp-name').innerText = n;
                loadAssignedAccounts();
            } else alert("Invalid Passcode!");
        }

        function loadAssignedAccounts() {
            onValue(ref(db, `assignments/${loggedEmp}`), (snap) => {
                const tbody = document.getElementById('assigned-accounts-body'); tbody.innerHTML=''; totalRAssign=0; totalMAssign=0;
                if(snap.exists()) {
                    snap.forEach(ch => {
                        const a = ch.val(), id = ch.key;
                        a.type==='REGULAR' ? totalRAssign++ : totalMAssign++;
                        let insVal = a.type==='REGULAR' ? `${a.installments} INS` : `${a.installments} INS (Yr: ${a.year})`;
                        tbody.innerHTML += `<tr><td><strong>${a.accountNo}</strong></td><td>${a.type}</td><td>${insVal}</td>
                            <td><select id="st-${id}" class="input-sm"><option value="">Select</option><option value="LOCK">LOCK</option><option value="PCR">PCR</option><option value="OP">OP</option><option value="SEEZING">SEEZING</option></select></td>
                            <td><input type="number" id="am-${id}" class="input-sm" placeholder="0"></td>
                            <td><button class="btn-submit" onclick="submitPerf('${id}','${a.type}','${a.installments} INS')">Submit</button></td></tr>`;
                    });
                }
            });
        }

        window.submitPerf = function(id, type, ins) {
            const st = document.getElementById(`st-${id}`).value, am = document.getElementById(`am-${id}`).value;
            if(!st) return alert("Select Status");
            set(ref(db, `daily_performance/${todayStr}/${loggedEmp}/${id}`), { 
                accountNo: document.getElementById(`st-${id}`).parentElement.parentElement.cells[0].innerText, 
                type: type, ins: ins, status: st, amount: am||0 
            }).then(()=>alert("✅ Submited!")).catch(e => alert("❌ Error: " + e.message));
        }

        window.fetchEmployeeReport = function() {
            const dateInput = document.getElementById('report-date-select').value;
            if(!dateInput) return alert("Please select a date!");
            
            const selDate = new Date(dateInput);
            const dbDate = `${selDate.getDate().toString().padStart(2,'0')}-${(selDate.getMonth()+1).toString().padStart(2,'0')}-${selDate.getFullYear()}`;
            document.getElementById('print-report-date').innerText = dbDate;
            document.getElementById('print-header-div').style.display = 'block';

            onValue(ref(db, `daily_performance/${dbDate}/${loggedEmp}`), (snap) => {
                const tbody = document.getElementById('submitted-performance-body'); tbody.innerHTML='';
                let rC={c:0,l:0,p:0,o:0,s:0}, mC={c:0,l:0,p:0,o:0,s:0};
                
                if(snap.exists()) {
                    snap.forEach(ch => {
                        const d = ch.val(), t = d.type==='REGULAR'?rC:mC;
                        t.c++; if(d.status==='LOCK')t.l++; else if(d.status==='PCR')t.p++; else if(d.status==='OP'||d.status==="OP'S")t.o++; else if(d.status==='SEEZING')t.s++;
                        tbody.innerHTML += `<tr><td><strong>${d.accountNo}</strong></td><td>${d.type}</td><td>${d.ins||'-'}</td><td>${d.status}</td><td>₹${d.amount}</td></tr>`;
                    });
                } else { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No records found.</td></tr>'; }

                document.getElementById('r-cards').innerHTML = bCard(totalRAssign, rC); document.getElementById('m-cards').innerHTML = bCard(totalMAssign, mC);
            });
        }
        function bCard(a,c){ return `<div class="stat-card"><h5>Assigned</h5><div class="val">${a}</div></div><div class="stat-card"><h5>Completed</h5><div class="val">${c.c}</div></div><div class="stat-card"><h5>Balance</h5><div class="val">${Math.max(0,a-c.c)}</div></div><div class="stat-card"><h5>LOCK</h5><div class="val">${c.l}</div></div><div class="stat-card"><h5>PCR</h5><div class="val">${c.p}</div></div><div class="stat-card"><h5>OP</h5><div class="val">${c.o}</div></div><div class="stat-card"><h5>SEEZING</h5><div class="val">${c.s}</div></div>`; }
    </script>
    <script>
        function switchTab(id, btn) { document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active')); document.querySelectorAll('.tab-btn').forEach(e=>e.classList.remove('active')); document.getElementById(id).classList.add('active'); btn.classList.add('active'); }
    </script>
</body>
</html>
