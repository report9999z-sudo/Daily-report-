<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Collection Entry</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f7; margin: 0; padding: 10px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h2 { color: #003366; text-align: center; border-bottom: 2px solid #ccc; padding-bottom: 10px; }
        label { font-weight: bold; font-size: 13px; color: #444; display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ced4da; border-radius: 5px; font-size: 14px; }
        .btn { padding: 12px; font-size: 15px; border-radius: 5px; font-weight: bold; cursor: pointer; border: none; color: white; width: 100%; margin-top: 15px;}
        .btn-blue { background: #003366; } .btn-green { background: #28a745; }
        
        .acc-card { background: #f8f9fa; border: 1px solid #b3d4fc; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
        .acc-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 15px; color: #003366; margin-bottom: 5px; border-bottom: 1px dashed #ccc; padding-bottom: 5px;}
        .acc-row { display: flex; gap: 10px; }
        
        /* PDF STYLES */
        #pdf-wrapper { display: none; }
        #print-area { background: white; padding: 30px; font-family: 'Segoe UI', sans-serif; color: #002244; width: 800px; margin: 0 auto; box-sizing: border-box; }
        .pdf-title-box { background: #003366; color: white; text-align: center; padding: 12px; border-radius: 8px; font-size: 20px; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; }
        .pdf-section-title { background: #003366; color: white; padding: 8px 15px; border-radius: 5px 20px 20px 5px; display: inline-block; font-size: 15px; font-weight: bold; margin-bottom: 10px; }
        .pdf-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 14px; text-align: center; }
        .pdf-table th { background: #e6f2ff; color: #003366; padding: 10px; border: 1px solid #b3d4fc; }
        .pdf-table td { padding: 10px; border: 1px solid #b3d4fc; vertical-align: middle; line-height: 1.6; }
        .pdf-table .total-row { background: #003366; color: white; font-weight: bold; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div class="container" id="login-screen">
        <h2>Executive Login</h2>
        <label>Date:</label><input type="date" id="login-date">
        <label>Select Name:</label><select id="login-name"></select>
        <label>Passcode (PIN):</label><input type="password" id="login-pin" placeholder="Enter 4-Digit PIN">
        <button class="btn btn-blue" onclick="verifyLogin()">Login & Fetch Accounts</button>
    </div>

    <!-- ENTRY SCREEN -->
    <div class="container" id="entry-screen" style="display:none;">
        <h2>Collection Entry</h2>
        <div style="background:#e6f2ff; padding:10px; border-radius:5px; margin-bottom:15px; text-align:center; font-weight:bold; color:#003366;">
            Executive: <span id="display-name"></span> | Date: <span id="display-date"></span>
        </div>

        <h3 style="background:#003366; color:white; padding:10px; border-radius:5px;">Assigned Accounts List</h3>
        <p style="font-size:12px; color:#555;">Fill the outcome for each assigned account below:</p>
        
        <div id="accounts-container"></div>
        <!-- Status Dropdown Template: Pending, Lock, PCR, QR, Office, Seizing -->

        <button class="btn btn-green" onclick="generatePDF()">📄 Generate Official PDF Report</button>
    </div>

    <div id="pdf-wrapper"><div id="print-area"></div></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC9PnjAdBeOEy0TLQvUBJUznlZFKSS82uI",
            databaseURL: "https://sri-vishnu-priya-finance-c591f-default-rtdb.firebaseio.com",
            projectId: "sri-vishnu-priya-finance-c591f",
            storageBucket: "sri-vishnu-priya-finance-c591f.firebasestorage.app",
            appId: "1:184676228358:android:7ef47b55ab678bb0dfd287"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentExec = ""; let currentDate = ""; let assignedData = [];

        document.getElementById('login-date').valueAsDate = new Date();

        // Load Names for Login
        db.ref('Executives').on('value', snap => {
            let dropdown = document.getElementById('login-name');
            dropdown.innerHTML = '<option value="">-- Select --</option>';
            if(snap.exists()){ snap.forEach(child => { dropdown.innerHTML += `<option value="${child.key}">${child.key}</option>`; }); }
        });

        // Verify Passcode & Fetch Accounts
        function verifyLogin() {
            let date = document.getElementById('login-date').value;
            let name = document.getElementById('login-name').value;
            let pin = document.getElementById('login-pin').value;
            if(!name || !pin) return alert("Enter Name and PIN");

            db.ref('Executives/' + name).once('value').then(snap => {
                if(snap.exists() && snap.val().pin === pin) {
                    currentExec = name; currentDate = date;
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('entry-screen').style.display = 'block';
                    document.getElementById('display-name').innerText = name;
                    document.getElementById('display-date').innerText = date;
                    fetchAssignedAccounts();
                } else { alert("Incorrect Passcode!"); }
            });
        }

        function fetchAssignedAccounts() {
            db.ref('Assignments/' + currentDate + '/' + currentExec).once('value').then(snap => {
                let container = document.getElementById('accounts-container');
                container.innerHTML = '';
                if(snap.exists()) {
                    assignedData = snap.val();
                    assignedData.forEach((acc, index) => {
                        let color = acc.type === "Regular" ? "blue" : "red";
                        container.innerHTML += `
                            <div class="acc-card">
                                <div class="acc-header">
                                    <span>${acc.accNo} <small style="color:${color};">(${acc.type})</small></span>
                                    <span style="font-size:12px; color:#555;">Target: ₹${acc.targetAmt}</span>
                                </div>
                                <div class="acc-row">
                                    <select id="status-${index}" style="flex:1;">
                                        <option value="Pending">Pending (Not done)</option>
                                        <option value="Lock">Lock</option>
                                        <option value="PCR">PCR</option>
                                        <option value="QR">QR</option>
                                        <option value="Office / Others">Office / Others</option>
                                        <option value="Seizing">Seizing</option>
                                    </select>
                                    <input type="number" id="amt-${index}" placeholder="Collected (₹)" style="flex:1;">
                                </div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = `<p style="color:red; text-align:center; font-weight:bold;">No Accounts Assigned for Today.</p>`;
                }
            });
        }

        function generatePDF() {
            if(assignedData.length === 0) return alert("No assigned accounts to generate report.");

            let metrics = { assigned: assignedData.length, completed: 0, pending: 0, lockC: 0, pcrC: 0, qrC: 0, seizingC: 0, totalAmt: 0 };
            
            // To segregate rows for PDF
            let rowsHTML = { Regular: "", Matured: "" }; 
            let hasRegular = false, hasMatured = false;

            assignedData.forEach((acc, index) => {
                let status = document.getElementById(`status-${index}`).value;
                let amt = parseFloat(document.getElementById(`amt-${index}`).value) || 0;
                
                if(status === "Pending") { metrics.pending++; } 
                else { 
                    metrics.completed++; 
                    if(status === "Lock") metrics.lockC++;
                    if(status === "PCR") metrics.pcrC++;
                    if(status === "QR") metrics.qrC++;
                    if(status === "Seizing") metrics.seizingC++;
                    metrics.totalAmt += amt;

                    let rowData = `<tr><td style="text-align:left; font-weight:bold;">${status}</td><td>${acc.accNo}</td><td>${status === 'Seizing' ? '-' : '₹ ' + amt}</td></tr>`;
                    if(acc.type === "Regular") { rowsHTML.Regular += rowData; hasRegular = true; }
                    if(acc.type === "Matured") { rowsHTML.Matured += rowData; hasMatured = true; }
                }
            });

            let compRate = metrics.assigned > 0 ? ((metrics.completed / metrics.assigned) * 100).toFixed(2) : "0.00";
            
            let printArea = document.getElementById('print-area');
            let pdfWrapper = document.getElementById('pdf-wrapper');

            let html = `
                <div class="pdf-title-box">DAILY COLLECTION PERFORMANCE REPORT</div>
                <div class="pdf-meta"><div><i class="fa-regular fa-calendar-days"></i> Date : ${currentDate}</div><div><i class="fa-solid fa-user"></i> Executive : ${currentExec}</div></div>
                
                <div class="pdf-section-title">1. Daily Performance Summary</div>
                <table style="width:100%; text-align:center; font-size:14px; margin-bottom:15px; border-collapse:collapse;">
                    <tr style="background:#e6f2ff; border:1px solid #b3d4fc;"><th style="padding:10px;">Assigned</th><th>Completed</th><th>Pending</th><th>Lock</th><th>PCR</th><th>Seizing</th></tr>
                    <tr style="font-weight:bold; font-size:18px; border:1px solid #b3d4fc;"><td style="padding:10px;">${metrics.assigned}</td><td style="color:green;">${metrics.completed}</td><td style="color:orange;">${metrics.pending}</td><td>${metrics.lockC}</td><td>${metrics.pcrC}</td><td style="color:purple;">${metrics.seizingC}</td></tr>
                </table>

                <div class="pdf-section-title">2. Collection Details</div>
                <table class="pdf-table">
                    <thead><tr><th>Status Category</th><th>Account No.</th><th>Collected Amount (₹)</th></tr></thead>
                    <tbody>`;
            
            if(hasRegular) {
                html += `<tr style="background:#e6e6e6;"><td colspan="3" style="text-align:left; font-weight:bold; color:blue;">REGULAR ACCOUNTS</td></tr>` + rowsHTML.Regular;
            }
            if(hasMatured) {
                html += `<tr style="background:#e6e6e6;"><td colspan="3" style="text-align:left; font-weight:bold; color:red;">MATURED ACCOUNTS</td></tr>` + rowsHTML.Matured;
            }
            
            html += `
                        <tr class="total-row"><td style="text-align:left;">Overall Total</td><td>${metrics.completed} Completed Accs</td><td>₹ ${metrics.totalAmt.toLocaleString('en-IN')}</td></tr>
                    </tbody>
                </table>

                <div class="pdf-section-title">3. Executive Remarks</div>
                <table style="width:100%; border:1px solid #b3d4fc; background:#f8f9fa; padding:15px; font-size:14px;">
                    <tr>
                        <td style="width:50%; line-height:2;">
                            <b>Total Assigned:</b> ${metrics.assigned}<br>
                            <b>Successfully Completed:</b> ${metrics.completed}<br>
                            <b>Pending Accounts:</b> ${metrics.pending}
                        </td>
                        <td style="width:50%; line-height:2;">
                            <b>Total Collected Amount:</b> ₹ ${metrics.totalAmt.toLocaleString('en-IN')}<br>
                            <b>Total Seizing Cases:</b> ${metrics.seizingC}
                        </td>
                    </tr>
                </table>
            `;

            printArea.innerHTML = html;
            document.getElementById('entry-screen').style.display = 'none';
            pdfWrapper.style.display = 'block';

            let opt = {
                margin: 10, filename: `${currentExec}_Report_${currentDate}.pdf`, image: { type: 'jpeg', quality: 1.0 },
                html2canvas: { scale: 2, useCORS: true, windowWidth: 800 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(printArea).save().then(() => {
                pdfWrapper.style.display = 'none';
                document.getElementById('entry-screen').style.display = 'block';
                // Optional: Save final report to DB here if needed
            });
        }
    </script>
</body>
</html>
